<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Avatars - KICKOFF Admin</title>
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="assets/css/page-overrides.css">
<script src="assets/js/kickoff-ui.js"></script>
<script src="includes/nav.js" data-page="admin_avatars" data-layout="admin"></script>
</head>
<body>
<div id="page-main">
  <div class="sec-tag">Catalog</div>
  <h1 class="sec-title">Avatar <em>Library</em></h1>
  <section class="section-panel">
    <form id="avatar-form" class="form-row-3">
      <input type="hidden" id="avatar-id">
      <div class="form-group">
        <label class="form-label" for="avatar-name">Avatar name</label>
        <input class="form-input" id="avatar-name" placeholder="e.g. Blue Captain" required>
      </div>
      <div class="form-group">
        <label class="form-label" for="avatar-category">Category</label>
        <select class="form-select form-input" id="avatar-category" required>
          <option value="male_character">Male Characters</option>
          <option value="female_character">Female Characters</option>
          <option value="country_flag">Country Flags</option>
          <option value="club">Clubs</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label" for="avatar-file">Avatar image</label>
        <input class="form-input" id="avatar-file" type="file" accept=".svg">
        <p class="form-hint" id="avatar-file-hint">SVG only, up to 5MB.</p>
      </div>
      <div class="form-group">
        <label class="form-label" for="avatar-sort">Display order</label>
        <input class="form-input" id="avatar-sort" type="number" value="100" step="10">
        <p class="form-hint">Lower numbers show first in the picker. Leave as 100 to put it near the end.</p>
      </div>
      <div class="form-group" style="align-self:end;">
        <button class="btn-lime btn-full" type="submit">Save Avatar</button>
      </div>
      <div class="form-group" id="avatar-cancel-wrap" style="align-self:end;display:none;">
        <button class="btn-ghost btn-full" type="button" id="avatar-cancel">Cancel edit</button>
      </div>
    </form>
  </section>
  <section class="section-panel">
    <div class="table-wrap"><table class="data-table"><thead><tr><th>Avatar</th><th>Name</th><th>Category</th><th>Status</th><th>Actions</th></tr></thead><tbody id="avatar-rows"></tbody></table></div>
  </section>
</div>
<script>
const esc = value => KickoffUI.escapeHtml(value);
const categoryLabel = { male_character: "Male Characters", female_character: "Female Characters", country_flag: "Country Flags", club: "Clubs" };
async function load() {
  const res = await fetch("api/admin/avatars.php", { credentials: "same-origin" });
  const data = await res.json();
  document.getElementById("avatar-rows").innerHTML = (data.avatars || []).map(a => `<tr>
    <td><img src="assets/avatars/${esc(a.file_path)}" alt="" style="width:42px;height:42px;object-fit:contain;"></td>
    <td>${esc(a.name)}</td><td>${esc(categoryLabel[a.category] || a.category)}</td><td>${Number(a.is_active) ? "Active" : "Inactive"}</td>
    <td style="display:flex;gap:8px;flex-wrap:wrap;">
      <button class="btn-ghost btn-sm" onclick='editAvatar(${JSON.stringify(a).replace(/'/g, "&#039;")})'>Edit</button>
      <button class="btn-ghost btn-sm" onclick="toggleAvatar(${Number(a.id)},${Number(a.is_active) ? 0 : 1})">${Number(a.is_active) ? "Deactivate" : "Activate"}</button>
      <button class="btn-danger btn-sm" onclick="deleteAvatar(${Number(a.id)},'${esc(a.name).replace(/'/g, "\\'")}')">Delete</button>
    </td>
  </tr>`).join("");
}
function editAvatar(a) {
  document.getElementById("avatar-id").value = a.id;
  document.getElementById("avatar-name").value = a.name;
  document.getElementById("avatar-category").value = a.category;
  document.getElementById("avatar-sort").value = a.sort_order || 100;
  document.getElementById("avatar-file").required = false;
  document.getElementById("avatar-file-hint").textContent = `Current file: ${a.file_path}. Choose a new file only if you want to replace it.`;
  document.getElementById("avatar-cancel-wrap").style.display = "";
  document.getElementById("avatar-name").scrollIntoView({ behavior: "smooth", block: "center" });
}
function resetAvatarForm() {
  document.getElementById("avatar-form").reset();
  document.getElementById("avatar-id").value = "";
  document.getElementById("avatar-file-hint").textContent = "SVG only, up to 5MB.";
  document.getElementById("avatar-cancel-wrap").style.display = "none";
}
document.getElementById("avatar-cancel").addEventListener("click", resetAvatarForm);
async function toggleAvatar(id, active) {
  const res = await fetch("api/admin/avatars.php", { method: "POST", headers: { "Content-Type": "application/json" }, credentials: "same-origin", body: JSON.stringify({ action: "toggle", id, is_active: active }) });
  const data = await res.json();
  KickoffUI.toast(data.success ? "Avatar updated." : (data.error || "Could not update avatar."), data.success ? "success" : "error");
  load();
}
async function deleteAvatar(id, name) {
  if (!confirm(`Delete "${name}"? This removes the image file and can't be undone.`)) return;
  const res = await fetch("api/admin/avatars.php", { method: "POST", headers: { "Content-Type": "application/json" }, credentials: "same-origin", body: JSON.stringify({ action: "delete", id }) });
  const data = await res.json();
  KickoffUI.toast(data.success ? "Avatar deleted." : (data.error || "Could not delete avatar."), data.success ? "success" : "error");
  load();
}
document.getElementById("avatar-form").addEventListener("submit", async event => {
  event.preventDefault();
  const id = Number(document.getElementById("avatar-id").value || 0);
  const file = document.getElementById("avatar-file").files[0];
  if (!id && !file) {
    KickoffUI.toast("Choose an SVG file to upload.", "error");
    return;
  }
  const fd = new FormData();
  fd.append("id", id);
  fd.append("name", document.getElementById("avatar-name").value);
  fd.append("category", document.getElementById("avatar-category").value);
  fd.append("sort_order", document.getElementById("avatar-sort").value || 0);
  if (file) fd.append("file", file);
  const res = await fetch("api/admin/avatars.php", { method: "POST", credentials: "same-origin", body: fd });
  const data = await res.json();
  KickoffUI.toast(data.success ? "Avatar saved." : (data.error || "Could not save avatar."), data.success ? "success" : "error");
  if (data.success) { resetAvatarForm(); load(); }
});
load();
</script>
</body>
</html>
