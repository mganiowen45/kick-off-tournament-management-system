<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Reset Password - KICKOFF</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="assets/css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Teko:wght@400;600&family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>
<body class="auth-page">
  <div class="auth-container">
    <div class="auth-card" style="max-width: 450px;">
      <h2 class="auth-title">Choose New Password</h2>
      <p class="auth-subtitle">Create a new, strong password for your account.</p>
      
      <div id="general-error" class="alert-error" style="display:none;"></div>
      <div id="general-success" class="alert-success" style="display:none;"></div>
      
      <form id="reset-form">
        <div class="form-group">
          <label class="form-label" for="password">New Password</label>
          <input type="password" class="form-input" id="password" required minlength="8">
        </div>
        <div class="form-group">
          <label class="form-label" for="password_confirm">Confirm New Password</label>
          <input type="password" class="form-input" id="password_confirm" required minlength="8">
        </div>
        <button type="submit" class="btn btn-primary w-100 mt-2" id="submit-btn">Reset Password</button>
      </form>
      <div class="auth-footer mt-3" id="login-link" style="display:none;">
        <a href="login.html" class="btn btn-secondary w-100">Go to Login</a>
      </div>
    </div>
  </div>

  <script src="assets/js/api.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('reset-form');
      const errBox = document.getElementById('general-error');
      const succBox = document.getElementById('general-success');
      const btn = document.getElementById('submit-btn');
      const loginLink = document.getElementById('login-link');
      
      const urlParams = new URLSearchParams(window.location.search);
      const token = urlParams.get('token');

      if (!token) {
        form.style.display = 'none';
        errBox.textContent = 'Invalid or missing reset token. Please request a new link.';
        errBox.style.display = 'block';
        return;
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        errBox.style.display = 'none';
        succBox.style.display = 'none';
        
        const pwd = document.getElementById('password').value;
        const confirm = document.getElementById('password_confirm').value;
        
        if (pwd !== confirm) {
            errBox.textContent = 'Passwords do not match.';
            errBox.style.display = 'block';
            return;
        }
        
        btn.disabled = true;
        btn.textContent = 'Saving...';

        try {
          const res = await apiCall('/auth/reset_password.php', 'POST', {
            token: token,
            password: pwd,
            password_confirm: confirm
          });
          
          if (res.success) {
            form.style.display = 'none';
            succBox.textContent = res.message || 'Password successfully reset.';
            succBox.style.display = 'block';
            loginLink.style.display = 'block';
          } else {
            errBox.textContent = res.error || 'Reset failed';
            errBox.style.display = 'block';
            btn.disabled = false;
            btn.textContent = 'Reset Password';
          }
        } catch (err) {
          errBox.textContent = 'A network error occurred. Please try again.';
          errBox.style.display = 'block';
          btn.disabled = false;
          btn.textContent = 'Reset Password';
        }
      });
    });
  </script>
</body>
</html>
