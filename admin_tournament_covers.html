<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tournament Covers - KICKOFF Admin</title>
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="assets/css/page-overrides.css">
<script src="assets/js/kickoff-ui.js"></script>
<script src="includes/nav.js" data-page="admin_tournament_covers" data-layout="admin"></script>
</head>
<body>
<div id="page-main">
  <div class="sec-tag">Catalog</div>
  <h1 class="sec-title">Tournament <em>Covers</em></h1>
  <section class="section-panel">
    <form id="cover-form" class="form-row-3">
      <input type="hidden" id="cover-id">
      <div class="form-group">
        <label class="form-label" for="cover-name">Cover name</label>
        <input class="form-input" id="cover-name" placeholder="e.g. Neon Stadium" required>
      </div>
      <div class="form-group">
        <label class="form-label" for="cover-category">Category</label>
        <select class="form-select form-input" id="cover-category" required>
          <option value="" disabled selected>Choose a category</option>
          <option value="Arena">Arena</option>
          <option value="Stadium">Stadium</option>
          <option value="Bracket">Bracket</option>
          <option value="Console">Console</option>
          <option value="Mobile">Mobile</option>
          <option value="World Stage">World Stage</option>
          <option value="Neon">Neon</option>
          <option value="General">General</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label" for="cover-file">Cover image</label>
        <input class="form-input" id="cover-file" type="file" accept=".svg,.png,.jpg,.jpeg,.webp">
        <p class="form-hint" id="cover-file-hint">SVG, PNG, JPG or WEBP, up to 5MB.</p>
      </div>
      <div class="form-group">
        <label class="form-label" for="cover-sort">Display order</label>
        <input class="form-input" id="cover-sort" type="number" value="100" step="10">
        <p class="form-hint">Lower numbers show first in the picker. Leave as 100 to put it near the end.</p>
      </div>
      <div class="form-group" style="align-self:end;">
        <button class="btn-lime btn-full" type="submit">Save Cover</button>
      </div>
      <div class="form-group" id="cover-cancel-wrap" style="align-self:end;display:none;">
        <button class="btn-ghost btn-full" type="button" id="cover-cancel">Cancel edit</button>
      </div>
    </form>
  </section>
  <div class="t-grid" id="cover-grid"></div>
</div>
<script>
const esc = value => KickoffUI.escapeHtml(value);
async function load() {
  const res = await fetch("api/admin/covers.php", { credentials: "same-origin" });
  const data = await res.json();
  document.getElementById("cover-grid").innerHTML = (data.covers || []).map(c => `<div class="t-card t-card-cover">
    <div class="tc-cover"><img src="${esc(c.resolved_file_path || c.file_path)}" alt=""></div>
    <div class="tc-body">
      <div class="tc-name">${esc(c.name)} ${c.asset_missing ? '<span class="badge badge-loss">Missing file</span>' : ""}</div>
      <div class="tc-host">${esc(c.category)} - ${Number(c.is_active) ? "Active" : "Inactive"}</div>
      <div style="display:flex;gap:8px;margin-top:1rem;flex-wrap:wrap;">
        <button class="btn-ghost btn-sm" onclick='editCover(${JSON.stringify(c).replace(/'/g, "&#039;")})'>Edit</button>
        <button class="btn-ghost btn-sm" onclick="toggleCover(this,${Number(c.id)},${Number(c.is_active) ? 0 : 1})">${Number(c.is_active) ? "Deactivate" : "Activate"}</button>
        <button class="btn-danger btn-sm" onclick="deleteCover(this,${Number(c.id)},'${esc(c.name).replace(/'/g, "\\'")}')">Delete</button>
      </div>
    </div>
  </div>`).join("");
}
function editCover(c) {
  document.getElementById("cover-id").value = c.id;
  document.getElementById("cover-name").value = c.name;
  document.getElementById("cover-category").value = c.category;
  document.getElementById("cover-sort").value = c.sort_order || 100;
  document.getElementById("cover-file").required = false;
  document.getElementById("cover-file-hint").textContent = `Current file: ${c.file_path}. Choose a new file only if you want to replace it.`;
  document.getElementById("cover-cancel-wrap").style.display = "";
  document.getElementById("cover-name").scrollIntoView({ behavior: "smooth", block: "center" });
}
function resetCoverForm() {
  document.getElementById("cover-form").reset();
  document.getElementById("cover-id").value = "";
  document.getElementById("cover-file-hint").textContent = "SVG, PNG, JPG or WEBP, up to 5MB.";
  document.getElementById("cover-cancel-wrap").style.display = "none";
}
document.getElementById("cover-cancel").addEventListener("click", resetCoverForm);
async function toggleCover(btn, id, active) {
  await KickoffUI.withButtonLoading(btn, "Updating...", async () => {
    const res = await fetch("api/admin/covers.php", { method: "POST", headers: { "Content-Type": "application/json" }, credentials: "same-origin", body: JSON.stringify({ action: "toggle", id, is_active: active }) });
    const data = await res.json();
    KickoffUI.toast(data.success ? "Cover updated." : (data.error || "Could not update cover."), data.success ? "success" : "error");
    load();
  });
}
async function deleteCover(btn, id, name) {
  if (!confirm(`Delete "${name}"? This removes the image file and can't be undone.`)) return;
  await KickoffUI.withButtonLoading(btn, "Deleting...", async () => {
    const res = await fetch("api/admin/covers.php", { method: "POST", headers: { "Content-Type": "application/json" }, credentials: "same-origin", body: JSON.stringify({ action: "delete", id }) });
    const data = await res.json();
    KickoffUI.toast(data.success ? "Cover deleted." : (data.error || "Could not delete cover."), data.success ? "success" : "error");
    load();
  });
}
document.getElementById("cover-form").addEventListener("submit", async event => {
  event.preventDefault();
  const btn = event.submitter || event.currentTarget.querySelector("button[type=submit]");
  const id = Number(document.getElementById("cover-id").value || 0);
  const file = document.getElementById("cover-file").files[0];
  if (!id && !file) {
    KickoffUI.toast("Choose an image to upload.", "error");
    return;
  }
  const fd = new FormData();
  fd.append("id", id);
  fd.append("name", document.getElementById("cover-name").value);
  fd.append("category", document.getElementById("cover-category").value);
  fd.append("sort_order", document.getElementById("cover-sort").value || 0);
  if (file) fd.append("file", file);
  await KickoffUI.withButtonLoading(btn, "Saving...", async () => {
    const res = await fetch("api/admin/covers.php", { method: "POST", credentials: "same-origin", body: fd });
    const data = await res.json();
    KickoffUI.toast(data.success ? "Cover saved." : (data.error || "Could not save cover."), data.success ? "success" : "error");
    if (data.success) { resetCoverForm(); load(); }
  });
});
load();
</script>
</body>
</html>
