<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Forgot Password - KICKOFF</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="assets/css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Teko:wght@400;600&family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>
<body class="auth-page">
  <div class="auth-container">
    <div class="auth-card" style="max-width: 450px;">
      <h2 class="auth-title">Password Recovery</h2>
      <p class="auth-subtitle">Enter the email address associated with your KICKOFF account.</p>
      
      <div id="general-error" class="alert-error" style="display:none;"></div>
      <div id="general-success" class="alert-success" style="display:none;"></div>
      
      <form id="forgot-form">
        <div class="form-group">
          <label class="form-label" for="email">Email address</label>
          <input type="email" class="form-input" id="email" placeholder="you@example.com" required>
        </div>
        <button type="submit" class="btn btn-primary w-100 mt-2" id="submit-btn">Send Reset Link</button>
      </form>
      <div class="auth-footer mt-3">
        Remembered your password? <a href="login.html">Back to Login</a>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('forgot-form');
      const errBox = document.getElementById('general-error');
      const succBox = document.getElementById('general-success');
      const btn = document.getElementById('submit-btn');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        errBox.style.display = 'none';
        succBox.style.display = 'none';
        btn.disabled = true;
        btn.textContent = 'Sending...';

        try {
          const req = await fetch('api/auth/forgot_password.php', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: document.getElementById('email').value.trim() })
          });
          const res = await req.json();
          
          if (res.success) {
            form.style.display = 'none';
            succBox.textContent = res.message || 'If an account exists for this email address, a password reset link has been sent.';
            succBox.style.display = 'block';
          } else {
            errBox.textContent = res.error || 'Request failed';
            errBox.style.display = 'block';
            btn.disabled = false;
            btn.textContent = 'Send Reset Link';
          }
        } catch (err) {
          errBox.textContent = 'A network error occurred. Please try again.';
          errBox.style.display = 'block';
          btn.disabled = false;
          btn.textContent = 'Send Reset Link';
        }
      });
    });
  </script>
</body>
</html>
